<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATIBEAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --bg: #15140f;
  --surface: #1e1c16;
  --surface-2: #26241c;
  --border: #38352a;
  --border-strong: #4a4636;
  --text: #ede9dc;
  --text-dim: #a6a191;
  --text-faint: #6f6b5c;
  --lime: #c8e85a;
  --lime-dim: #8fa83f;
  --red: #e2645a;
  --amber: #e0a94a;
  --sky: #6db8e8;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --glass-bg: rgba(38, 36, 28, 0.55);
  --glass-border: rgba(237, 233, 220, 0.09);
  --glass-highlight: rgba(255, 255, 255, 0.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(ellipse 600px 400px at 15% -5%, rgba(200,232,90,0.09), transparent),
    radial-gradient(ellipse 500px 400px at 90% 15%, rgba(224,169,74,0.06), transparent),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(88px + var(--safe-bottom));
  min-height: 100vh;
}
h1, h2, h3, .display {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
}
::-webkit-scrollbar { display: none; }

/* ---- liquid glass surface ---- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
}

/* ---- top header ---- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: 18px 18px 14px;
}
.topbar::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: -24px;
  z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0%, rgba(21,20,15,0.75) 45%, transparent 100%);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  -webkit-mask-image: linear-gradient(180deg, black 0%, black 55%, transparent 100%);
  mask-image: linear-gradient(180deg, black 0%, black 55%, transparent 100%);
  opacity: 0; transition: opacity 0.25s ease;
}
.topbar.scrolled::after { opacity: 1; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand-left { display: flex; align-items: center; gap: 9px; }
.brand-logo { width: 30px; height: 30px; flex: 0 0 auto; }
.brand-logo path { fill: var(--text); }
.brand-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px;
  letter-spacing: 0.12em; color: var(--text); text-transform: uppercase;
}
.today-pill {
  display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap;
}
.today-pill .tp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); flex: 0 0 auto; }

/* ---- day pills row (entreno) ---- */
.day-pills {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 14px;
  scroll-snap-type: x proximity;
}
.day-pill {
  flex: 0 0 auto; scroll-snap-align: start;
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 999px; padding: 9px 16px; font-size: 13px; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.02em;
}
.day-pill.active { background: var(--lime); color: #14170a; border-color: var(--lime); }
.day-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
.day-pill.done .dot { background: var(--lime-dim); }
.day-pill.active .dot { background: #14170a; }

/* ---- main sections ---- */
.view { display: none; padding: 0 18px 20px; }
.view.active { display: block; }

/* ---- reminder banner (entreno) ---- */
.reminder-banner {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 14px;
  background: rgba(200,232,90,0.08); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid rgba(200,232,90,0.25); border-radius: 12px;
}
.reminder-banner i { color: var(--lime); font-size: 18px; flex: 0 0 auto; }
.reminder-banner .rb-text { flex: 1; font-size: 13px; color: var(--text-dim); line-height: 1.4; }
.reminder-banner .rb-text b { color: var(--text); font-weight: 500; }
.reminder-banner .rb-btn {
  flex: 0 0 auto; background: var(--lime); color: #14170a; border: none; border-radius: 999px;
  padding: 7px 14px; font-size: 12.5px; font-weight: 500; cursor: pointer;
}

/* ---- day header card ---- */
.day-header {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 16px;
}
.day-header .tag { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.day-header h2 { font-size: 22px; margin-top: 4px; }
.day-header .meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
.day-progress-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.day-progress-bar { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.day-progress-fill { height: 100%; background: var(--lime); border-radius: 4px; transition: width 0.3s ease; }
.day-progress-label { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

/* ---- exercise card ---- */
.exercise {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.exercise-head {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer;
}
.exercise-num {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface-2); color: var(--text-dim); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
}
.exercise.complete .exercise-num { background: var(--lime); color: #14170a; }
.exercise-info { flex: 1; min-width: 0; }
.exercise-name { font-size: 15px; font-weight: 500; color: var(--text); }
.exercise-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.exercise-chevron { color: var(--text-faint); transition: transform 0.2s ease; font-size: 18px; }
.exercise.open .exercise-chevron { transform: rotate(180deg); }
.exercise-body { display: none; padding: 0 16px 16px; }
.exercise.open .exercise-body { display: block; }

.exercise-illustration {
  background: var(--surface-2); border-radius: 10px; padding: 14px 18px 8px;
  color: var(--text-dim); margin-bottom: 12px;
}
.exercise-illustration .frames-label {
  display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px;
}
.exercise-notes {
  font-size: 13px; color: var(--text-dim); background: var(--surface-2);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.5;
}
.exercise-notes b { color: var(--text); font-weight: 500; }

.set-row-label {
  display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.06em; padding: 0 4px 6px;
}
.set-rows { display: flex; flex-direction: column; gap: 6px; }
.set-row {
  display: grid; grid-template-columns: 28px 1fr 1fr 32px; gap: 8px; align-items: center;
}
.set-row .set-idx { font-size: 13px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.set-row input[type=number] {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; padding: 8px 10px;
  font-variant-numeric: tabular-nums;
}
.set-row input[type=number]:focus { outline: none; border-color: var(--lime); }
.set-check {
  width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid var(--border);
  background: var(--surface-2); display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 16px; cursor: pointer;
}
.set-check.checked { background: var(--lime); border-color: var(--lime); color: #14170a; }

/* ---- sensation row ---- */
.sensation-row { margin-top: 14px; }
.sensation-row label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
.sensation-row textarea {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 13.5px; padding: 10px 12px;
  font-family: inherit; resize: vertical; min-height: 44px;
}
.sensation-row textarea:focus { outline: none; border-color: var(--lime); }

/* ---- cardio card ---- */
.cardio-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px;
}
.cardio-card .icon { font-size: 22px; color: var(--amber); flex: 0 0 auto; }
.cardio-card .txt { flex: 1; font-size: 13px; color: var(--text-dim); }
.cardio-card .txt b { color: var(--text); font-weight: 500; }
.cardio-toggle {
  flex: 0 0 auto; width: 44px; height: 26px; border-radius: 999px; background: var(--surface-2);
  border: 0.5px solid var(--border); position: relative; cursor: pointer;
}
.cardio-toggle .knob {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-faint); transition: all 0.2s ease;
}
.cardio-toggle.on { background: rgba(200,232,90,0.18); border-color: var(--lime-dim); }
.cardio-toggle.on .knob { left: 20px; background: var(--lime); }

.finish-btn {
  width: 100%; padding: 15px; border-radius: var(--radius); border: none;
  background: var(--lime); color: #14170a; font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px; font-weight: 600; letter-spacing: 0.02em; margin-top: 6px; cursor: pointer;
}
.finish-btn:active { transform: scale(0.98); }
.finish-btn.done { background: var(--surface-2); color: var(--text-dim); border: 0.5px solid var(--border); }

/* ---- section title ---- */
.section-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint);
  margin: 22px 0 10px; font-weight: 600;
}
.section-title:first-child { margin-top: 4px; }

/* ---- generic info card ---- */
.info-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 15px 17px; margin-bottom: 10px;
}
.info-card h3 { font-size: 16px; margin-bottom: 6px; }
.info-card p { font-size: 13.5px; color: var(--text-dim); margin: 0; }
.info-card ul { margin: 6px 0 0; padding-left: 18px; }
.info-card li { font-size: 13.5px; color: var(--text-dim); margin-bottom: 4px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 340px) { .two-col { grid-template-columns: 1fr; } }

/* ---- creatina card ---- */
.creatina-card { display: flex; flex-direction: column; gap: 12px; }
.creatina-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.creatina-label { font-size: 14.5px; font-weight: 500; color: var(--text); }
.creatina-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.creatina-toggle {
  flex: 0 0 auto; width: 44px; height: 26px; border-radius: 999px;
  position: relative; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease;
}
.creatina-toggle .knob {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: left 0.2s ease;
}
.creatina-toggle.off { background: rgba(226,100,90,0.22); border: 0.5px solid rgba(226,100,90,0.5); }
.creatina-toggle.off .knob { left: 2px; background: var(--red); }
.creatina-toggle.on { background: rgba(200,232,90,0.22); border: 0.5px solid var(--lime-dim); }
.creatina-toggle.on .knob { left: 20px; background: var(--lime); }

.run-types-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
.run-type-btn {
  padding: 12px 6px; border-radius: 10px; border: 0.5px solid var(--border);
  background: var(--surface-2); color: var(--text-dim); font-size: 12.5px; font-weight: 500;
  text-align: center; cursor: pointer;
}
.run-type-btn.active-sky { background: rgba(109,184,232,0.16); border-color: var(--sky); color: var(--text); }

/* ---- día libre / extra de dieta ---- */
.diarelibre-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cal-input {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px;
  font-variant-numeric: tabular-nums; font-family: 'Inter', sans-serif;
}
.cal-input:focus { outline: none; border-color: var(--sky); }

.franja-card { padding: 13px 15px; margin-bottom: 8px; }
.franja-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 10px; }
.franja-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.franja-field label { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; display: block; margin-bottom: 4px; }
.franja-field .cal-input { padding: 8px 6px; font-size: 12.5px; text-align: center; }

.body-form-card { padding: 15px 16px; margin-bottom: 10px; }
.body-form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.body-form-grid .franja-field label { font-size: 9.5px; }

.backup-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px; border-radius: 12px; border: 0.5px solid var(--glass-border);
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  color: var(--text-dim); font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif;
  margin-bottom: 6px;
}
.backup-btn i { font-size: 16px; }

.history-toggle-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: 0.5px solid var(--glass-border);
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  color: var(--lime); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif;
  margin-bottom: 16px;
}

/* ---- meal card (dieta) ---- */
.meal-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.meal-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.meal-head h3 { font-size: 16px; }
.meal-note { font-size: 12px; color: var(--text-faint); font-style: italic; padding: 0 16px 10px; margin-top: -8px; }
.meal-body { display: none; padding: 0 16px 16px; }
.meal-card.open .meal-body { display: block; }
.meal-option {
  border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s ease;
}
.meal-option.selected { border-color: var(--lime); background: rgba(200,232,90,0.06); }
.meal-option-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0; }
.meal-option-row .k { color: var(--text-faint); flex: 0 0 34px; font-weight: 600; }
.meal-option-row .v { color: var(--text); flex: 1; text-align: right; }
.meal-check { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--lime); margin-top: 4px; }

.meal-hint { font-size: 12px; color: var(--text-faint); margin-bottom: 12px; line-height: 1.5; }
.meal-column { margin-bottom: 14px; }
.meal-column:last-child { margin-bottom: 0; }
.meal-column-label {
  font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 600; margin-bottom: 7px;
}
.meal-chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.meal-chip {
  border: 0.5px solid var(--border); border-radius: 999px; padding: 8px 13px; font-size: 12.5px;
  color: var(--text-dim); cursor: pointer; background: var(--surface-2); transition: all 0.15s ease;
}
.meal-chip.selected { border-color: var(--lime); background: rgba(200,232,90,0.14); color: var(--text); font-weight: 500; }

/* ---- supplement table ---- */
.supp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.supp-table td { padding: 7px 0; border-bottom: 0.5px solid var(--border); vertical-align: top; }
.supp-table td:first-child { color: var(--text); font-weight: 500; padding-right: 10px; width: 42%; }
.supp-table td:last-child { color: var(--text-dim); text-align: right; }
.supp-table tr:last-child td { border-bottom: none; }

/* ---- bottom nav (floating island, liquid glass) ---- */
.bottom-nav-wrap {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: center;
  padding: 0 16px calc(14px + var(--safe-bottom));
  pointer-events: none;
}
.bottom-nav {
  pointer-events: auto;
  display: flex; align-items: center; gap: 4px;
  background: rgba(38, 36, 28, 0.55);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 0.5px solid rgba(237, 233, 220, 0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 32px rgba(0,0,0,0.35);
  border-radius: 999px;
  padding: 7px;
}
.nav-btn {
  position: relative; flex: 0 0 auto;
  width: 64px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); background: none; border: none; cursor: pointer;
  border-radius: 999px;
}
.nav-pill {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--lime);
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.nav-btn.active .nav-pill { opacity: 1; transform: scale(1); }
.nav-btn.active { color: #14170a; }
.nav-btn .nav-icon { width: 22px; height: 22px; position: relative; z-index: 1; }

/* ---- history / stats ---- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.stat-card.wide { grid-column: 1 / -1; }
.stat-card .label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-card .value { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; margin-top: 2px; }
.stat-card .value.lime { color: var(--lime); }

/* ---- streak hero (progreso) ---- */
.streak-hero {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 20px 16px; margin-bottom: 16px; border-radius: 18px;
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
}
.streak-flame { font-size: 30px; line-height: 1; margin-bottom: 4px; }
.streak-num { font-family: 'Barlow Condensed', sans-serif; font-size: 42px; font-weight: 700; color: var(--lime); line-height: 1; }
.streak-label { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 13px; }
.empty-state .big { font-size: 32px; display: block; margin-bottom: 10px; }

/* ---- historial (progreso) ---- */
.hist-day-card { padding: 15px 16px; }
.hist-date { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 10px; }
.hist-entreno-row { margin-bottom: 10px; }
.hist-entreno-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; color: var(--text); }
.hist-badge { color: var(--lime); font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; }
.hist-entreno-row p { font-size: 12.5px; color: var(--text-dim); margin: 3px 0 0; }
.hist-sensacion { font-style: italic; margin-top: 6px !important; }
.hist-meals { border-top: 0.5px solid var(--glass-border); padding-top: 10px; margin-top: 4px; }
.hist-meals-title { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 6px; }
.hist-meal-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 3px 0; }
.hmr-name { color: var(--text-dim); flex: 0 0 auto; }
.hmr-val { color: var(--text); text-align: right; }

/* ---- year calendar (github style) ---- */
.year-nav { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 10px; }
.year-nav-btn {
  width: 28px; height: 28px; border: none; background: none;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer;
  padding: 0; transition: color 0.15s ease;
}
.year-nav-btn svg { width: 20px; height: 20px; }
.year-nav-btn:active { color: var(--lime); }
.year-nav-label { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); min-width: 52px; text-align: center; }
.year-cal-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 15px 16px; margin-bottom: 12px;
}
.year-cal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.year-cal-head h3 { font-size: 15px; }
.year-cal-head .count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.year-cal-scroll { overflow-x: auto; padding-bottom: 4px; }
.year-cal-grid {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px);
  gap: 3px; width: max-content;
}
.year-cal-cell {
  width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2);
  border: 0.5px solid var(--border);
}
.year-cal-cell.future { opacity: 0.35; }
.year-cal-cell.done-entreno { background: var(--lime); border-color: var(--lime); }
.year-cal-cell.done-dieta { background: var(--amber); border-color: var(--amber); }
.year-cal-cell.done-creatina { background: var(--sky); border-color: var(--sky); }
.year-cal-cell.double { box-shadow: 0 0 0 1.5px var(--amber); }
.year-cal-cell.double.today { box-shadow: 0 0 0 1.5px var(--amber), 0 0 0 3px var(--text); }
.year-cal-cell.today { box-shadow: 0 0 0 1.5px var(--text); }
.year-cal-months {
  display: grid; grid-auto-flow: column; gap: 3px; width: max-content; margin-bottom: 4px;
}
.year-cal-month-label {
  font-size: 9.5px; color: var(--text-faint); grid-row: span 1;
}
.year-cal-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
.year-cal-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---- pesos summary card (progreso) ---- */
.pesos-summary-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius); padding: 16px 16px 8px; margin-bottom: 12px;
}
.psc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.psc-tag { font-size: 12.5px; color: var(--sky); font-weight: 600; }
.psc-date { font-size: 11px; color: var(--text-faint); }
.peso-summary-row { padding-bottom: 16px; margin-bottom: 12px; border-bottom: 0.5px solid var(--glass-border); }
.peso-summary-row:last-child { border-bottom: none; margin-bottom: 4px; }
.psr-name { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
.psr-graph { position: relative; }
.spark-svg { width: 100%; height: 50px; display: block; }
.spark-single { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 600; color: var(--sky); }
.spark-single span { font-size: 13px; color: var(--text-faint); margin-left: 3px; }
.spark-range { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 2px; }
.psr-current { font-size: 12.5px; color: var(--text-dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
.peso-delta { font-size: 11px; font-weight: 600; margin-left: 4px; }
.peso-delta.up { color: var(--lime); }
.peso-delta.down { color: var(--red); }
.peso-delta.same { color: var(--text-faint); }
.peso-delta.neutral { color: var(--text-dim); }

/* ---- logros / medallas ---- */
.medals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
.medal {
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 14px; padding: 14px 8px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.medal-badge {
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: 1.5px solid var(--border);
}
.medal-emoji { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: 0.5; }
.medal.unlocked .medal-badge {
  background: linear-gradient(135deg, rgba(200,232,90,0.22), rgba(200,232,90,0.06));
  border-color: var(--lime);
}
.medal.unlocked .medal-emoji { filter: none; opacity: 1; }
.medal-label { font-size: 11.5px; font-weight: 600; color: var(--text-dim); line-height: 1.2; }
.medal.unlocked .medal-label { color: var(--text); }
.medal-desc { font-size: 9.5px; color: var(--text-faint); line-height: 1.25; }
.medal.locked { opacity: 0.55; }

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--lime); color: #14170a; padding: 10px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s ease;
  z-index: 50; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- inicio (home) ---- */
.week-strip { margin-bottom: 16px; }
.week-strip-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week-day {
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 11px; padding: 8px 4px 9px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 72px; justify-content: flex-start;
  position: relative;
}
.week-day .wd-label { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.wd-dots-row { display: flex; gap: 3px; align-items: center; margin: 1px 0; }
.week-day .wd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); margin: 0; }
.week-day .wd-dot.done { background: var(--lime); }
.week-day .wd-dot.rest { background: var(--text-faint); }
.week-day .wd-dot.run { background: var(--lime); }
.week-day .wd-txt { font-size: 8.8px; color: var(--text-dim); line-height: 1.15; font-weight: 500; word-break: break-word; }
.week-day.today { border-color: var(--lime); background: rgba(200,232,90,0.08); }
.week-day.today .wd-txt { color: var(--text); }
.week-day.is-run .wd-txt { color: var(--lime); }
.week-day.is-completed { opacity: 0.7; }
.wd-reporte-badge {
  position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--amber); color: #1a1400; display: flex; align-items: center; justify-content: center;
  font-size: 9px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); z-index: 2;
}
.wd-reporte-badge i { font-size: 9px; }

.hero-card {
  background: var(--glass-bg); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 32px rgba(0,0,0,0.22);
  border-radius: 18px; padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute; top: -60%; right: -30%; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(200,232,90,0.16), transparent 70%);
  pointer-events: none;
}
.hero-eyebrow { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.hero-title { font-size: 24px; margin-top: 6px; }
.hero-sub { font-size: 13.5px; color: var(--text-dim); margin-top: 5px; }
.hero-cta {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 11px 18px;
  background: var(--lime); color: #14170a; border-radius: 999px; font-size: 14px; font-weight: 500;
  text-decoration: none; cursor: pointer; border: none; font-family: 'Inter', sans-serif;
}
.hero-cta.secondary {
  background: rgba(255,255,255,0.06); color: var(--text); border: 0.5px solid var(--glass-border);
}
.hero-rest-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: rgba(224,169,74,0.12); border: 0.5px solid rgba(224,169,74,0.3); color: var(--amber);
  font-size: 13px; font-weight: 500; margin-top: 6px;
}

.quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.quick-card {
  background: var(--glass-bg); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 14px; padding: 14px; cursor: pointer;
}
.quick-card .qi { font-size: 20px; color: var(--lime); margin-bottom: 8px; display: block; }
.quick-card .qt { font-size: 13.5px; font-weight: 500; }
.quick-card .qs { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

/* ---- reporte semanal card (inicio) ---- */
.reporte-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; margin-bottom: 16px;
  border-radius: 14px; background: var(--glass-bg); backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.reporte-label { font-size: 13.5px; font-weight: 500; color: var(--text); }
.reporte-sub { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
.reporte-num-block { flex: 0 0 auto; display: flex; align-items: baseline; gap: 5px; }
.reporte-num { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 800; color: var(--lime); line-height: 1; letter-spacing: -0.01em; }
.reporte-num-label { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 500; color: var(--text-faint); letter-spacing: -0.01em; line-height: 1; }
.reporte-card.soon { border-color: rgba(224,169,74,0.4); background: rgba(224,169,74,0.08); }
.reporte-card.soon .reporte-num { color: var(--amber); }
.reporte-card.today { border-color: var(--lime-dim); background: rgba(200,232,90,0.1); }
.reporte-card.today .reporte-num { font-size: 24px; }

/* ---- reporte semanal (página completa) ---- */
.reporte-page-header {
  padding: 16px 18px; margin: 4px 0 8px;
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 14px;
}
.reporte-page-tag { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.reporte-page-date { font-size: 15px; color: var(--text); font-weight: 500; margin-top: 4px; }
.body-link-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;
}
.body-link-card i { color: var(--text-faint); font-size: 16px; }

.mini-meal-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 0.5px solid var(--glass-border);
}
.mini-meal-row:last-child { border-bottom: none; }
.mini-meal-row .mi { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--text-faint); font-size: 13px; }
.mini-meal-row.chosen .mi { background: var(--lime); color: #14170a; }
.mini-meal-row .mt { flex: 1; font-size: 13.5px; }
.mini-meal-row .mv { font-size: 12px; color: var(--text-faint); }
.mini-meal-row.chosen .mv { color: var(--lime); }

/* ---- valoracion diaria con estrellas ---- */
.rating-row { padding: 10px 0; border-bottom: 0.5px solid var(--glass-border); }
.rating-row:last-child { border-bottom: none; }
.rating-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
.rating-stars { display: flex; gap: 2px; flex-wrap: wrap; }
.star { font-size: 17px; color: var(--border-strong); cursor: pointer; line-height: 1; user-select: none; }
.star.filled { color: var(--lime); }
.star.readonly { cursor: default; }
.rating-value-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rating-avg-num { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600; color: var(--text); flex: 0 0 auto; }
</style>
</head>

// getPlanForDate(fechaISO) — devuelve el plan vigente en una fecha concreta
// (la última versión cuyo "desde" sea <= esa fecha). Se usa para mostrar
// correctamente el historial pasado aunque el plan haya cambiado desde entonces.
function getPlanForDate(fechaISO) {
  let vigente = PLAN_VERSIONS[0];
  for (const v of PLAN_VERSIONS) {
    if (v.desde <= fechaISO) vigente = v;
    else break;
  }
  return vigente.plan;
}

// getCurrentPlan() — el plan vigente hoy mismo.
function getCurrentPlan() {
  const hoy = new Date().toISOString().slice(0, 10);
  return getPlanForDate(hoy);
}

// PLAN_DATA — alias del plan vigente HOY. Todo el código existente que ya usa
// PLAN_DATA.dias, PLAN_DATA.dieta, etc. sigue funcionando sin cambios, porque
// siempre apunta a la versión activa en el momento de cargar la app.

<script>

const LOCAL_PREFIX = 'cambio_fisico_pablo:';
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      return raw !== null ? { key, value: raw } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
      return { key, value };
    } catch (e) { console.error('No se pudo guardar en este dispositivo', e); return null; }
  },
  async delete(key) {
    try { localStorage.removeItem(LOCAL_PREFIX + key); return { key, deleted: true }; }
    catch (e) { return null; }
  }
};

// ===================== LÓGICA: SIGUIENTE DÍA PENDIENTE =====================
// Recorre los 5 días de forma secuencial y cíclica. Devuelve el primer día
// que NO tenga ningún registro con finished=true, empezando justo después
// del último día que sí se completó (el más reciente por fecha).
function getNextPendingDia() {
  const dias = PLAN_DATA.dias;
  // Buscar el último día completado (por fecha de finalización más reciente)
  let lastCompletedIdx = -1;
  let lastCompletedFecha = null;
  dias.forEach((dia, idx) => {
    const dayLogs = STATE.logs[dia.id] || {};
    Object.keys(dayLogs).forEach(fecha => {
      if (dayLogs[fecha].finished) {
        if (!lastCompletedFecha || fecha > lastCompletedFecha) {
          lastCompletedFecha = fecha;
          lastCompletedIdx = idx;
        }
      }
    });
  });
  if (lastCompletedIdx === -1) return dias[0]; // nada registrado aún: empezar por el día 1
  const nextIdx = (lastCompletedIdx + 1) % dias.length;
  return dias[nextIdx];
}

function isDiaCompletadoHoy(diaId) {
  const fecha = todayISO();
  const log = STATE.logs[diaId] && STATE.logs[diaId][fecha];
  return !!(log && log.finished);
}

// ===================== REPORTE SEMANAL A JORGE =====================
// Primer reporte: 23 de septiembre de 2026. A partir de ahí, cada 7 días exactos.
const REPORTE_INICIO = '2026-09-23';

function getNextReporteDate(refDateISO) {
  // Devuelve la próxima fecha ISO (>= refDateISO) en que toca enviar el reporte,
  // calculada como REPORTE_INICIO + N*7 días.
  const inicio = new Date(REPORTE_INICIO + 'T00:00:00');
  const ref = new Date(refDateISO + 'T00:00:00');
  if (ref <= inicio) return REPORTE_INICIO;
  const diffDias = Math.round((ref - inicio) / 86400000);
  const semanasPasadas = Math.floor(diffDias / 7);
  const candidata = new Date(inicio);
  candidata.setDate(candidata.getDate() + semanasPasadas * 7);
  if (isoDate(candidata) < refDateISO) candidata.setDate(candidata.getDate() + 7);
  return isoDate(candidata);
}

function renderReporteCard() {
  const todayStr = todayISO();
  const proximaFecha = getNextReporteDate(todayStr);
  const diffDias = Math.round((new Date(proximaFecha + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);

  let urgencyClass = '';
  let numTxt = String(diffDias);
  let numLabel = diffDias === 1 ? 'DÍA' : 'DÍAS';
  if (diffDias === 0) { urgencyClass = 'today'; numTxt = 'HOY'; numLabel = ''; }
  else if (diffDias === 1) { urgencyClass = 'soon'; }

  return `
    <div class="reporte-card ${urgencyClass}">
      <div class="reporte-txt">
        <div class="reporte-label">Reporte a Jorge</div>
        <div class="reporte-sub">${fmtDateEs(proximaFecha)}</div>
      </div>
      <div class="reporte-num-block">
        <span class="reporte-num">${numTxt}</span>
        ${numLabel ? `<span class="reporte-num-label">${numLabel}</span>` : ''}
      </div>
    </div>
  `;
}

// ===================== RENDER: MI SEMANA (secuencia flexible, no atada a días fijos) =====================
// La semana ya no depende del día del calendario: se construye encadenando el orden
// de entrenos (dia1→dia2→dia3→dia4→dia5→dia1...) a partir del último día completado,
// e intercalando "Correr" cada 2 entrenos — así nunca cae justo antes/después de un día de pierna (dia1, dia5).
function buildFlexibleSequence(count) {
  const dias = PLAN_DATA.dias;
  const nextDia = getNextPendingDia(); // ya existe: calcula el siguiente entreno pendiente
  const startIdx = dias.findIndex(d => d.id === nextDia.id);

  const sequence = [];
  let entrenoCount = 0;
  let idx = startIdx;
  while (sequence.length < count) {
    const dia = dias[idx % dias.length];
    // Intercalar un día de correr tras cada 2 entrenos, pero nunca justo después de un día de pierna (dia1 o dia5)
    if (entrenoCount > 0 && entrenoCount % 2 === 0 && dia.id !== 'dia1' && sequence[sequence.length - 1]?.type !== 'correr') {
      sequence.push({ type: 'correr' });
    }
    sequence.push({ type: 'entreno', diaId: dia.id });
    entrenoCount++;
    idx++;
  }
  return sequence.slice(0, count);
}

function renderWeekStrip() {
  const todayStr = todayISO();
  const sequence = buildFlexibleSequence(7);
  const dowShort = ['D', 'L', 'M', 'X', 'J', 'V', 'S']; // getDay(): 0=domingo...6=sábado

  // Generar las 7 fechas reales de calendario: hoy + los 6 días siguientes
  const calendarDates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(todayStr + 'T00:00:00');
    d.setDate(d.getDate() + i);
    calendarDates.push(d);
  }

  const proximoReporte = getNextReporteDate(todayStr);

  const cellsHtml = sequence.map((item, i) => {
    const isToday = i === 0;
    let txt, dotClass, isRun = false, isCompleted = false;
    let dobleCompletado = false; // true si hoy se completó TAMBIÉN la otra actividad (entreno + correr el mismo día)

    if (item.type === 'entreno') {
      const dia = PLAN_DATA.dias.find(dd => dd.id === item.diaId);
      txt = dia.nombre.split(':')[0];
      if (isToday) {
        isCompleted = isDiaCompletadoHoy(item.diaId);
        const correrHoy = STATE.logs['__correr__'] && STATE.logs['__correr__'][todayStr];
        if (correrHoy && correrHoy.finished) dobleCompletado = true;
      }
      dotClass = isCompleted ? 'done' : 'rest';
    } else {
      txt = 'Correr';
      isRun = true;
      if (isToday) {
        isCompleted = !!(STATE.logs['__correr__'] && STATE.logs['__correr__'][todayStr] && STATE.logs['__correr__'][todayStr].finished);
        // ¿algún día de entreno también se completó hoy?
        const otroEntrenoHoy = PLAN_DATA.dias.some(dd => isDiaCompletadoHoy(dd.id));
        if (otroEntrenoHoy) dobleCompletado = true;
      }
      dotClass = isCompleted ? 'run' : 'rest';
    }

    const cd = calendarDates[i];
    const dateLabel = `${dowShort[cd.getDay()]} ${cd.getDate()}`;
    const esReporte = isoDate(cd) === proximoReporte;
    const dotsHtml = (isToday && dobleCompletado)
      ? `<div class="wd-dot ${dotClass}"></div><div class="wd-dot ${dotClass}"></div>`
      : `<div class="wd-dot ${dotClass}"></div>`;

    return `
      <div class="week-day ${isToday ? 'today' : ''} ${isRun ? 'is-run' : ''} ${isCompleted ? 'is-completed' : ''}" onclick="handleWeekDayClick(${i}, '${item.type}', '${item.diaId || ''}')">
        ${esReporte ? '<div class="wd-reporte-badge"><i class="ti ti-send" aria-hidden="true"></i></div>' : ''}
        <div class="wd-label">${dateLabel}</div>
        <div class="wd-dots-row">${dotsHtml}</div>
        <div class="wd-txt">${txt}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="week-strip">
      <div class="week-strip-label">Tu próxima semana</div>
      <div class="week-grid">${cellsHtml}</div>
    </div>
  `;
}

function handleWeekDayClick(pos, type, diaId) {
  if (pos !== 0) {
    showToast('Esto es una previsión — se ajustará según vayas completando tus entrenos');
    return;
  }
  if (type === 'entreno' && diaId) {
    goToEntreno(diaId);
  } else if (type === 'correr') {
    goToEntreno('__correr__');
  }
}

function getMealsSummaryForDate(fecha) {
  const mealLog = STATE.mealLogs[fecha] || {};
  const plan = getPlanForDate(fecha);
  return plan.dieta.comidas.map(comida => {
    const sel = mealLog[comida.id];
    const chosen = sel !== undefined;
    let resumen = 'Sin elegir';
    if (chosen && Array.isArray(sel)) {
      resumen = sel.map((optIdx, colIdx) => optIdx !== null && optIdx !== undefined ? comida.opciones[optIdx][colIdx] : null).filter(Boolean).join(' + ');
      if (!resumen) resumen = 'Sin elegir';
    }
    return {
      nombreCorto: comida.nombre.replace(/^Comida \d+ · /, ''),
      resumen,
      chosen: chosen && resumen !== 'Sin elegir'
    };
  });
}

function renderMealCard(comida, mealLog) {
  // mealLog[comida.id] es un array paralelo a comida.columnas: uno por columna,
  // cada valor es el índice de fila (dentro de comida.opciones) elegido para esa columna,
  // o undefined/null si esa columna no se ha elegido todavía.
  const selArr = mealLog[comida.id] || [];
  const numColumnas = comida.columnas.length;

  // Solo cuentan como "elegibles" las columnas que tienen al menos una opción real (no todo "-")
  const columnasConOpciones = comida.columnas.map((_, colIdx) =>
    comida.opciones.some(fila => fila[colIdx] && fila[colIdx] !== '-')
  );
  const totalElegibles = columnasConOpciones.filter(Boolean).length;
  const elegidas = selArr.filter((v, i) => columnasConOpciones[i] && v !== undefined && v !== null).length;

  // Construir, por columna, la lista de valores únicos disponibles (con su índice de fila de origen)
  const columnasHtml = comida.columnas.map((colName, colIdx) => {
    const chipsHtml = comida.opciones.map((fila, rowIdx) => {
      const val = fila[colIdx];
      if (val === '-' || val === undefined) return ''; // esa fila no ofrece opción real en esta columna
      const isSelected = selArr[colIdx] === rowIdx;
      return `<div class="meal-chip ${isSelected ? 'selected' : ''}" onclick="selectMealColumnOption('${comida.id}', ${colIdx}, ${rowIdx}, ${numColumnas})">${val}</div>`;
    }).join('');
    if (!chipsHtml.trim()) return ''; // columna vacía en todas las filas (ej. "G" con solo "-")
    return `
      <div class="meal-column">
        <div class="meal-column-label">${colName}</div>
        <div class="meal-chip-row">${chipsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="meal-card" id="meal-${comida.id}">
      <div class="meal-head" onclick="toggleMeal('${comida.id}')">
        <h3>${comida.nombre}</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11.5px; color:${elegidas > 0 ? 'var(--lime)' : 'var(--text-faint)'};">${elegidas}/${totalElegibles}</span>
          <div class="exercise-chevron">⌄</div>
        </div>
      </div>
      ${comida.nota ? `<div class="meal-note">${comida.nota}</div>` : ''}
      <div class="meal-body">
        <div class="meal-hint">Elige una opción de cada categoría. Puedes combinar libremente.</div>
        ${columnasHtml}
      </div>
    </div>
  `;
}

function toggleMeal(mealId) {
  document.getElementById('meal-' + mealId).classList.toggle('open');
}

function selectMealColumnOption(mealId, colIdx, rowIdx, numColumnas) {
  const fecha = todayISO();
  if (!STATE.mealLogs[fecha]) STATE.mealLogs[fecha] = {};
  if (!Array.isArray(STATE.mealLogs[fecha][mealId])) STATE.mealLogs[fecha][mealId] = new Array(numColumnas).fill(null);
  const arr = STATE.mealLogs[fecha][mealId];
  arr[colIdx] = arr[colIdx] === rowIdx ? null : rowIdx;
  saveMealLogs();
  renderDieta();
  document.getElementById('meal-' + mealId).classList.add('open');
}


// ===================== CALENDARIO ANUAL (estilo github) =====================
function getEntrenoCompletedDates() {
  // set de fechas ISO donde CUALQUIER día de entreno fue marcado como finalizado
  const set = new Set();
  Object.keys(STATE.logs).forEach(dayId => {
    Object.keys(STATE.logs[dayId]).forEach(fecha => {
      if (STATE.logs[dayId][fecha].finished) set.add(fecha);
    });
  });
  return set;
}

function getDobleEntrenoCompletedDates() {
  // set de fechas ISO donde se completó TANTO un día de gimnasio (dia1-5) COMO Correr el mismo día
  const gymDates = new Set();
  PLAN_DATA.dias.forEach(dia => {
    const logs = STATE.logs[dia.id] || {};
    Object.keys(logs).forEach(fecha => { if (logs[fecha].finished) gymDates.add(fecha); });
  });
  const runDates = new Set();
  const runLogs = STATE.logs['__correr__'] || {};
  Object.keys(runLogs).forEach(fecha => { if (runLogs[fecha].finished) runDates.add(fecha); });

  const both = new Set();
  gymDates.forEach(f => { if (runDates.has(f)) both.add(f); });
  return both;
}

function getDietaCompletedDates() {
  // set de fechas ISO donde se eligió al menos una opción en alguna columna de alguna comida
  const set = new Set();
  Object.keys(STATE.mealLogs).forEach(fecha => {
    const meals = STATE.mealLogs[fecha];
    const anySelected = Object.values(meals).some(arr => Array.isArray(arr) && arr.some(v => v !== undefined && v !== null));
    if (anySelected) set.add(fecha);
  });
  return set;

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

function renderYearCalendar(title, doneDates, colorClass, legendLabel, legendColorVar, year, doubleDates) {
  doubleDates = doubleDates || new Set();
  const todayStr = todayISO();
  const start = new Date(year, 0, 1);
  // retroceder hasta el lunes anterior (o el mismo día) para alinear columnas de semana
  const startDow = (start.getDay() + 6) % 7; // 0 = lunes
  const gridStart = new Date(start);
  gridStart.setDate(gridStart.getDate() - startDow);

  const end = new Date(year, 11, 31);
  const endDow = (end.getDay() + 6) % 7;
  const gridEnd = new Date(end);
  gridEnd.setDate(gridEnd.getDate() + (6 - endDow));

  const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
  const totalWeeks = Math.ceil(totalDays / 7);

  const monthLabels = [];
  let cells = '';
  let lastMonth = -1;
  let count = 0;

  for (let w = 0; w < totalWeeks; w++) {
    const weekStartDate = new Date(gridStart);
    weekStartDate.setDate(weekStartDate.getDate() + w * 7);
    const m = weekStartDate.getMonth();
    if (m !== lastMonth && weekStartDate.getFullYear() === year) {
      monthLabels.push({ week: w, label: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m] });
      lastMonth = m;
    }
    for (let d = 0; d < 7; d++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w * 7 + d);
      const iso = isoDate(cellDate);
      const inYear = cellDate.getFullYear() === year;
      const isFuture = iso > todayStr;
      const isDone = doneDates.has(iso);
      const isDouble = doubleDates.has(iso);
      if (isDone && inYear) count++;
      let cls = 'year-cal-cell';
      if (!inYear) cls += ' future';
      else if (isFuture) cls += ' future';
      if (isDone) cls += ' ' + colorClass;
      if (isDouble) cls += ' double';
      if (iso === todayStr) cls += ' today';
      cells += `<div class="${cls}" title="${iso}${isDouble ? ' · doble entreno' : ''}"></div>`;
    }
  }

  // fila de labels de mes posicionada por columna (aprox, usando grid-column)
  let monthRow = '<div class="year-cal-months">';
  let colCursor = 0;
  monthLabels.forEach(m => {
    const gap = m.week - colCursor;
    for (let i = 0; i < gap; i++) monthRow += '<div style="width:11px;grid-row:span 7;"></div>';
    monthRow += `<div class="year-cal-month-label" style="grid-row:span 7;">${m.label}</div>`;
    colCursor = m.week + 1;
  });
  monthRow += '</div>';

  return `
    <div class="year-cal-card">
      <div class="year-cal-head"><h3>${title}</h3><div class="count">${count} días en ${year}</div></div>
      <div class="year-cal-scroll">
        ${monthRow}
        <div class="year-cal-grid">${cells}</div>
      </div>
      <div class="year-cal-legend">
        <span><span class="sw" style="background:var(--surface-2); border:0.5px solid var(--border);"></span>Sin registro</span>
        <span><span class="sw" style="background:var(--${legendColorVar});"></span>${legendLabel}</span>
        ${doubleDates.size > 0 ? `<span><span class="sw" style="background:var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--amber);"></span>Doble entreno</span>` : ''}
      </div>
    </div>
  `;
}

// ===================== LÓGICA: HISTÓRICO DE PESOS POR EJERCICIO =====================
// Recorre todas las sesiones registradas y construye, por ejercicio, una serie temporal
// del peso máximo levantado ese día (de entre las series marcadas como hechas).
function getPesoHistoryByExercise(dayId, referenceDate) {
  // Usa el plan vigente en referenceDate para saber qué ejercicios tiene ese día;
  // el histórico de pesos se agrupa por el id del ejercicio (ex.id), que se mantiene
  // estable mientras el asesor no reestructure por completo esos ejercicios.
  const plan = getPlanForDate(referenceDate || todayISO());
  const dia = plan.dias.find(d => d.id === dayId);
  if (!dia) return {};
  const history = {}; // { exId: [{fecha, pesoMax}, ...] ordenado por fecha }
  dia.ejercicios.forEach(ex => { history[ex.id] = []; });

  const dayLogs = STATE.logs[dayId] || {};
  Object.keys(dayLogs).sort().forEach(fecha => {
    const log = dayLogs[fecha];
    dia.ejercicios.forEach(ex => {
      const sets = (log.sets && log.sets[ex.id]) || [];
      const pesos = sets.filter(s => s && s.done && s.peso !== '' && s.peso !== undefined).map(s => parseFloat(s.peso)).filter(p => !isNaN(p));
      if (pesos.length > 0) {
        history[ex.id].push({ fecha, pesoMax: Math.max(...pesos) });
      }
    });
  });
  return history;
}

function renderMiniSparkline(points, unit = 'kg') {
  // points: [{fecha, pesoMax}], al menos 1 punto. Dibuja una línea SVG simple.
  if (points.length === 1) {
    return `<div class="spark-single">${points[0].pesoMax}<span>${unit}</span></div>`;
  }
  const w = 280, h = 60, pad = 8;
  const pesos = points.map(p => p.pesoMax);
  const min = Math.min(...pesos), max = Math.max(...pesos);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.pesoMax - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const lastPoint = coords[coords.length - 1];
  const dotsHtml = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--sky)"/>`).join('');

  return `
    <svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${pathD}" fill="none" stroke="var(--sky)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dotsHtml}
      <circle cx="${lastPoint[0].toFixed(1)}" cy="${lastPoint[1].toFixed(1)}" r="4" fill="var(--sky)" stroke="var(--bg)" stroke-width="1.5"/>
    </svg>
    <div class="spark-range"><span>${min}${unit}</span><span>${max}${unit}</span></div>
  `;
}

function renderPesosSummaryCard(dayId, fecha) {
  const dia = getPlanForDate(fecha).dias.find(d => d.id === dayId);
  const log = STATE.logs[dayId] && STATE.logs[dayId][fecha];
  if (!dia || !log) return '';

  const history = getPesoHistoryByExercise(dayId, fecha);

  const rowsHtml = dia.ejercicios.map(ex => {
    const hist = history[ex.id] || [];
    if (hist.length === 0) return '';
    const ultimo = hist[hist.length - 1];
    const anterior = hist.length > 1 ? hist[hist.length - 2] : null;
    let deltaHtml = '';
    if (anterior) {
      const delta = ultimo.pesoMax - anterior.pesoMax;
      if (delta > 0) deltaHtml = `<span class="peso-delta up">+${delta}kg</span>`;
      else if (delta < 0) deltaHtml = `<span class="peso-delta down">${delta}kg</span>`;
      else deltaHtml = `<span class="peso-delta same">=</span>`;
    }
    return `
      <div class="peso-summary-row">
        <div class="psr-name">${ex.nombre}</div>
        <div class="psr-graph">${renderMiniSparkline(hist)}</div>
        <div class="psr-current">${ultimo.pesoMax}kg ${deltaHtml}</div>
      </div>
    `;
  }).filter(Boolean).join('');

  if (!rowsHtml) return '';

  return `
    <div class="pesos-summary-card">
      <div class="psc-head">
        <div class="psc-tag">Último ${dia.nombre.split(':')[0]} completado</div>
        <div class="psc-date">${fmtDateEs(fecha)}</div>
      </div>
      ${rowsHtml}
    </div>
  `;
}

function getLastCompletedSession() {
  // Devuelve {dayId, fecha} de la sesión completada más reciente, o null
  let best = null;
  Object.keys(STATE.logs).forEach(dayId => {

      if (STATE.logs[dayId][fecha].finished) {
        if (!best || fecha > best.fecha) best = { dayId, fecha };
      }
    });
  });
  return best;
}

function getAchievementsData() {
  let totalDiasCompletados = 0;
  let totalSeriesHechas = 0;
  const fechasCompletadas = new Set();
  Object.keys(STATE.logs).forEach(dayId => {
    Object.keys(STATE.logs[dayId]).forEach(fecha => {
      const log = STATE.logs[dayId][fecha];
      if (log.finished) { totalDiasCompletados++; fechasCompletadas.add(fecha); }
      Object.values(log.sets || {}).forEach(setArr => {
        totalSeriesHechas += setArr.filter(s => s && s.done).length;
      });
    });
  });

  // racha actual: cuenta días con entreno completado, contando hacia atrás desde hoy.
  // Se permite 1 día de descanso consecutivo sin romper la racha (para encajar con un plan
  // que tiene descansos planificados entre sesiones). Solo se corta si hay 2 días seguidos sin nada.
  let racha = 0;
  let cursor = new Date(todayISO() + 'T00:00:00');
  let fallosSeguidos = 0;
  let primeraIteracion = true;
  while (true) {
    const iso = isoDate(cursor);
    if (fechasCompletadas.has(iso)) {
      racha++;
      fallosSeguidos = 0;
      cursor.setDate(cursor.getDate() - 1);
    } else if (iso === todayISO() && primeraIteracion) {
      // hoy aún sin completar no cuenta como fallo, simplemente no se ha llegado a hacer todavía
      cursor.setDate(cursor.getDate() - 1);
    } else {
      fallosSeguidos++;
      if (fallosSeguidos >= 2) break; // 2 días seguidos sin nada corta la racha
      cursor.setDate(cursor.getDate() - 1);
    }
    primeraIteracion = false;
  }

  const diasCreatina = Object.values(STATE.creatinaLogs).filter(Boolean).length;
  const diasDieta = getDietaCompletedDates().size;

  return { totalDiasCompletados, totalSeriesHechas, racha, diasCreatina, diasDieta };
}

function getWeeklyAverages(fechaReporte) {
  // Promedia los dailyRatings de todos los días desde el reporte ANTERIOR (exclusive) hasta fechaReporte (inclusive),
  // y suma las horas de sueño de esos mismos días.
  const inicioSemana = new Date(fechaReporte + 'T00:00:00');
  inicioSemana.setDate(inicioSemana.getDate() - 6); // ventana de 7 días terminando en fechaReporte

  const sums = {};
  const counts = {};
  VALORACION_FIELDS.forEach(f => { sums[f.id] = 0; counts[f.id] = 0; });
  let sueñoTotal = 0;

  Object.keys(STATE.dailyRatings).forEach(fecha => {
    const d = new Date(fecha + 'T00:00:00');
    if (d >= inicioSemana && d <= new Date(fechaReporte + 'T00:00:00')) {
      const r = STATE.dailyRatings[fecha];
      VALORACION_FIELDS.forEach(f => {
        if (r[f.id] !== undefined && r[f.id] > 0) { sums[f.id] += r[f.id]; counts[f.id]++; }
      });
      if (r.horasSueno && !isNaN(parseFloat(r.horasSueno))) sueñoTotal += parseFloat(r.horasSueno);
    }
  });

  const promedios = {};
  VALORACION_FIELDS.forEach(f => {
    promedios[f.id] = counts[f.id] > 0 ? Math.round((sums[f.id] / counts[f.id]) * 10) / 10 : null;
  });
  return { promedios, sueñoTotal };
}

    <div class="section-title">Sensaciones con el entrenamiento</div>
    <div class="info-card">
      <div class="sensation-row" style="margin-top:0;">
        <label>Cansancio, ejercicios que te gusten o no, los que te gustaría incluir...</label>
        <textarea placeholder="Escribe aquí..." oninput="onReporteTextoInput('${fechaReporte}','sensacionesEntreno', this.value)">${log.sensacionesEntreno || ''}</textarea>
      </div>
    </div>

    <div class="section-title">Algo más que quieras comentarle</div>
    <div class="info-card">
      <div class="sensation-row" style="margin-top:0;">
        <textarea placeholder="Escribe aquí..." oninput="onReporteTextoInput('${fechaReporte}','comentarioExtra', this.value)">${log.comentarioExtra || ''}</textarea>
      </div>
    </div>

    <button class="backup-btn" onclick="downloadReporte()">
      <i class="ti ti-download" aria-hidden="true"></i> Descargar reporte
    </button>
  `;

  document.getElementById('reporte-content').innerHTML = html;
}

function renderBodyForm(fecha) {
  const log = getBodyLog(fecha);
  const fieldsHtml = BODY_FIELDS.map(f => `
    <div class="franja-field">
      <label>${f.label} (${f.unit})</label>
      <input type="number" inputmode="decimal" class="cal-input" placeholder="0" value="${log[f.id] || ''}"
        oninput="onBodyFieldInput('${fecha}','${f.id}', this.value)">
    </div>
  `).join('');

  return `
    <div class="info-card body-form-card">
      <div class="franja-title">Medidas de esta semana</div>
      <div class="creatina-sub" style="margin-bottom:12px;">Recomendado: una vez por semana, siempre en las mismas condiciones</div>
      <div class="body-form-grid">${fieldsHtml}</div>
    </div>
  `;
}

function renderBodyProgressCard() {
  const rowsHtml = BODY_FIELDS.map(f => {
    const hist = getBodyHistory(f.id);
    if (hist.length === 0) return '';
    const sparklinePoints = hist.map(p => ({ fecha: p.fecha, pesoMax: p.valor })); // reutiliza renderMiniSparkline
    const ultimo = hist[hist.length - 1];
    const primero = hist[0];
    let deltaHtml = '';
    if (hist.length > 1) {
      const delta = Math.round((ultimo.valor - primero.valor) * 10) / 10;
      const sign = delta > 0 ? '+' : '';
      deltaHtml = delta !== 0 ? `<span class="peso-delta neutral">${sign}${delta}${f.unit}</span>` : `<span class="peso-delta same">=</span>`;
    }
    return `
      <div class="peso-summary-row">
        <div class="psr-name">${f.label}</div>
        <div class="psr-graph">${renderMiniSparkline(sparklinePoints, f.unit)}</div>
        <div class="psr-current">${ultimo.valor}${f.unit} ${deltaHtml}</div>
      </div>
    `;
  }).filter(Boolean).join('');

  if (!rowsHtml) return '';

  return `
    <div class="pesos-summary-card">
      <div class="psc-head">
        <div class="psc-tag">Evolución corporal</div>
        <div class="psc-date">Desde ${fmtDateEs(PLAN_DATA.meta.inicio)}</div>
      </div>
      ${rowsHtml}
    </div>
  `;
}

function downloadBackup() {
  const backup = {
    exportado: new Date().toISOString(),
    app: 'ATIBEAST',
    logs: STATE.logs,
    mealLogs: STATE.mealLogs,
    creatinaLogs: STATE.creatinaLogs,
    dietExtraLogs: STATE.dietExtraLogs,
    bodyLogs: STATE.bodyLogs
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = todayISO();
  a.href = url;
  a.download = `atibeast_backup_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Copia de seguridad descargada');
}

function renderProgreso() {
  const fechas = Object.keys(STATE.logs).reduce((acc, dayId) => {
    Object.keys(STATE.logs[dayId]).forEach(f => acc.add(f));
    return acc;
  }, new Set());
  Object.keys(STATE.mealLogs).forEach(f => {
    const meals = STATE.mealLogs[f];
    const anySelected = Object.values(meals).some(arr => Array.isArray(arr) && arr.some(v => v !== undefined && v !== null));
    if (anySelected) fechas.add(f);
  });

  let totalDiasCompletados = 0;
  let totalSeriesHechas = 0;
  let kilosTotales = 0;
  Object.keys(STATE.logs).forEach(dayId => {
    Object.values(STATE.logs[dayId]).forEach(log => {
      if (log.finished) totalDiasCompletados++;
      Object.values(log.sets || {}).forEach(setArr => {
        setArr.forEach(s => {
          if (s && s.done) {
            totalSeriesHechas++;
            const peso = parseFloat(s.peso);
            const reps = parseFloat(s.reps);
            if (!isNaN(peso) && !isNaN(reps)) kilosTotales += peso * reps;
          }
        });
      });
    });
  });
  kilosTotales = Math.round(kilosTotales);

  const entrenoDates = getEntrenoCompletedDates();
  const dietaDates = getDietaCompletedDates();
  const creatinaDates = getCreatinaCompletedDates();
  const dobleEntrenoDates = getDobleEntrenoCompletedDates();
  const lastSession = getLastCompletedSession();
  const racha = getAchievementsData().racha;

  const sortedFechas = Array.from(fechas).sort().reverse();
  const HISTORY_COLLAPSED_LIMIT = 5;
  const HISTORY_EXPANDED_LIMIT = 20;
  const historyLimit = historyExpanded ? HISTORY_EXPANDED_LIMIT : HISTORY_COLLAPSED_LIMIT;

  let historyHtml = '';
  let historyToggleHtml = '';
  if (sortedFechas.length === 0) {
    historyHtml = `<div class="empty-state"><i class="ti ti-clipboard-list big" aria-hidden="true" style="font-size:32px; display:block; margin-bottom:10px;"></i>Todavía no has registrado ningún día.<br>Empieza marcando series en Entreno.</div>`;
  } else {
    const visibleFechas = sortedFechas.slice(0, historyLimit);
    historyHtml = visibleFechas.map(fecha => {
      const dayEntries = Object.keys(STATE.logs).filter(dayId => STATE.logs[dayId][fecha]);

      const entrenoHtml = dayEntries.map(dayId => {
        const dia = getPlanForDate(fecha).dias.find(d => d.id === dayId);
        const log = STATE.logs[dayId][fecha];
        const setsCount = Object.values(log.sets || {}).reduce((sum, arr) => sum + arr.filter(s => s && s.done).length, 0);
        return `
          <div class="hist-entreno-row">
            <div class="hist-entreno-head">
              <span>${dia ? dia.nombre : 'Entreno (plan anterior)'}</span>
              ${log.finished ? '<span class="hist-badge">COMPLETADO</span>' : ''}
            </div>
            <p>${setsCount} series registradas${log.cardio ? ' · Cardio ✓' : ''}</p>
            ${log.sensacion ? `<p class="hist-sensacion">"${log.sensacion}"</p>` : ''}
          </div>
        `;
      }).join('');

      const mealsElegidas = getMealsSummaryForDate(fecha).filter(m => m.chosen);
      const mealsHtml = mealsElegidas.length > 0 ? `
        <div class="hist-meals">
          <div class="hist-meals-title">Comidas registradas</div>
          ${mealsElegidas.map(m => `
            <div class="hist-meal-row"><span class="hmr-name">${m.nombreCorto}</span><span class="hmr-val">${m.resumen}</span></div>
          `).join('')}
        </div>
      ` : '';

      if (!entrenoHtml && !mealsHtml) return '';

      return `
        <div class="info-card hist-day-card">
          <div class="hist-date">${fmtDateEs(fecha)}</div>
          ${entrenoHtml}
          ${mealsHtml}
        </div>
      `;
    }).join('');

    if (sortedFechas.length > HISTORY_COLLAPSED_LIMIT) {
      historyToggleHtml = `
        <button class="history-toggle-btn" onclick="toggleHistoryExpanded()">
          ${historyExpanded ? 'Ver menos' : `Ver más (hasta ${Math.min(HISTORY_EXPANDED_LIMIT, sortedFechas.length)})`}
        </button>
      `;
    }
  }

  document.getElementById('progreso-content').innerHTML = `
    <div class="streak-hero">
      <div class="streak-flame">🔥</div>
      <div class="streak-num">${racha}</div>
      <div class="streak-label">${racha === 1 ? 'día seguido entrenando' : 'días seguidos entrenando'}</div>
    </div>

    <div class="section-title">Resumen</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Días completados</div><div class="value lime">${totalDiasCompletados}</div></div>
      <div class="stat-card"><div class="label">Series totales</div><div class="value">${totalSeriesHechas}</div></div>
      <div class="stat-card wide"><div class="label">Kilos totales levantados</div><div class="value">${kilosTotales.toLocaleString('es-ES')} kg</div></div>
    </div>

    ${lastSession ? `<div class="section-title">Progreso de pesos</div>${renderPesosSummaryCard(lastSession.dayId, lastSession.fecha)}` : ''}

    <div class="section-title">Calendario del año</div>
    <div class="year-nav">
      <button class="year-nav-btn" onclick="changeCalendarYear(-1)" aria-label="Año anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <div class="year-nav-label">${selectedCalendarYear}</div>
      <button class="year-nav-btn" onclick="changeCalendarYear(1)" aria-label="Año siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    ${renderYearCalendar('Entrenamiento', entrenoDates, 'done-entreno', 'Día completado', 'lime', selectedCalendarYear, dobleEntrenoDates)}
    ${renderYearCalendar('Dieta', dietaDates, 'done-dieta', 'Comida registrada', 'amber', selectedCalendarYear)}
    ${renderYearCalendar('Creatina', creatinaDates, 'done-creatina', 'Creatina tomada', 'sky', selectedCalendarYear)}

    <div class="section-title">Cuerpo y medidas</div>
    <div class="info-card body-link-card" onclick="goToReporte()">
      <div class="creatina-txt">
        <div class="creatina-label">Actualiza tus medidas en Reporte</div>
        <div class="creatina-sub">Se registran una vez por semana</div>
      </div>
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </div>
    <div id="body-progress-card-slot">${renderBodyProgressCard()}</div>

    ${renderLogros()}

    <div class="section-title">Historial</div>
    ${historyHtml}
    ${historyToggleHtml}

    <div class="section-title">Tus datos</div>
    <button class="backup-btn" onclick="downloadBackup()">
      <i class="ti ti-download" aria-hidden="true"></i> Descargar copia de seguridad
    </button>
  `;

  // auto-scroll de cada calendario: al mes actual si es el año en curso, si no al principio del año
  const esAnioActual = selectedCalendarYear === new Date().getFullYear();
  requestAnimationFrame(() => {
    document.querySelectorAll('.year-cal-scroll').forEach(el => {
      el.scrollLeft = esAnioActual ? el.scrollWidth : 0;
    });
  });
}

// ===================== INIT =====================
async function init() {
  await loadState();
  const diasSemanaLargo = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const hoy = new Date();
  document.getElementById('today-pill-text').textContent = `${diasSemanaLargo[hoy.getDay()]} ${hoy.getDate()}`;
  renderInicio();
  renderDayPills();
  renderEntreno();
  renderDieta();
  initTopbarScrollEffect();
}

function initTopbarScrollEffect() {
  const topbar = document.querySelector('.topbar');
  if (!topbar) return;
  const onScroll = () => {
    if (window.scrollY > 8) topbar.classList.add('scrolled');
    else topbar.classList.remove('scrolled');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

init();

</script>
