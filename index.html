<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATIBEAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --bg: #15140f;
  --surface: #1e1c16;
  --surface-2: #26241c;
  --border: #38352a;
  --border-strong: #4a4636;
  --text: #ede9dc;
  --text-dim: #a6a191;
  --text-faint: #6f6b5c;
  --lime: #c8e85a;
  --lime-dim: #8fa83f;
  --red: #e2645a;
  --amber: #e0a94a;
  --sky: #6db8e8;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --glass-bg: rgba(38, 36, 28, 0.55);
  --glass-border: rgba(237, 233, 220, 0.09);
  --glass-highlight: rgba(255, 255, 255, 0.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(ellipse 600px 400px at 15% -5%, rgba(200,232,90,0.09), transparent),
    radial-gradient(ellipse 500px 400px at 90% 15%, rgba(224,169,74,0.06), transparent),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(88px + var(--safe-bottom));
  min-height: 100vh;
}
h1, h2, h3, .display {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
}
::-webkit-scrollbar { display: none; }

/* ---- liquid glass surface ---- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
}

/* ---- top header ---- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: 18px 18px 10px;
}
.brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.brand-logo { width: 20px; height: 20px; flex: 0 0 auto; }
.brand-logo path { fill: var(--text); }
.brand-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px;
  letter-spacing: 0.12em; color: var(--text); text-transform: uppercase;
}
.topbar .greeting { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }

/* ---- day pills row (entreno) ---- */
.day-pills {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 14px;
  scroll-snap-type: x proximity;
}
.day-pill {
  flex: 0 0 auto; scroll-snap-align: start;
  background: var(--glass-bg); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  border-radius: 999px; padding: 9px 16px; font-size: 13px; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.02em;
}
.day-pill.active { background: var(--lime); color: #14170a; border-color: var(--lime); }
.day-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
.day-pill.done .dot { background: var(--lime-dim); }
.day-pill.active .dot { background: #14170a; }

/* ---- main sections ---- */
.view { display: none; padding: 0 18px 20px; }
.view.active { display: block; }

/* ---- reminder banner (entreno) ---- */
.reminder-banner {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 14px;
  background: rgba(200,232,90,0.08); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 0.5px solid rgba(200,232,90,0.25); border-radius: 12px;
}
.reminder-banner i { color: var(--lime); font-size: 18px; flex: 0 0 auto; }
.reminder-banner .rb-text { flex: 1; font-size: 13px; color: var(--text-dim); line-height: 1.4; }
.reminder-banner .rb-text b { color: var(--text); font-weight: 500; }
.reminder-banner .rb-btn {
  flex: 0 0 auto; background: var(--lime); color: #14170a; border: none; border-radius: 999px;
  padding: 7px 14px; font-size: 12.5px; font-weight: 500; cursor: pointer;
}

/* ---- day header card ---- */
.day-header {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 16px;
}
.day-header .tag { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.day-header h2 { font-size: 22px; margin-top: 4px; }
.day-header .meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
.day-progress-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.day-progress-bar { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.day-progress-fill { height: 100%; background: var(--lime); border-radius: 4px; transition: width 0.3s ease; }
.day-progress-label { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

/* ---- exercise card ---- */
.exercise {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.exercise-head {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer;
}
.exercise-num {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface-2); color: var(--text-dim); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
}
.exercise.complete .exercise-num { background: var(--lime); color: #14170a; }
.exercise-info { flex: 1; min-width: 0; }
.exercise-name { font-size: 15px; font-weight: 500; color: var(--text); }
.exercise-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.exercise-chevron { color: var(--text-faint); transition: transform 0.2s ease; font-size: 18px; }
.exercise.open .exercise-chevron { transform: rotate(180deg); }
.exercise-body { display: none; padding: 0 16px 16px; }
.exercise.open .exercise-body { display: block; }

.exercise-illustration {
  background: var(--surface-2); border-radius: 10px; padding: 14px 18px 8px;
  color: var(--text-dim); margin-bottom: 12px;
}
.exercise-illustration .frames-label {
  display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px;
}
.exercise-notes {
  font-size: 13px; color: var(--text-dim); background: var(--surface-2);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.5;
}
.exercise-notes b { color: var(--text); font-weight: 500; }

.set-row-label {
  display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: 0.06em; padding: 0 4px 6px;
}
.set-rows { display: flex; flex-direction: column; gap: 6px; }
.set-row {
  display: grid; grid-template-columns: 28px 1fr 1fr 32px; gap: 8px; align-items: center;
}
.set-row .set-idx { font-size: 13px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.set-row input[type=number] {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; padding: 8px 10px;
  font-variant-numeric: tabular-nums;
}
.set-row input[type=number]:focus { outline: none; border-color: var(--lime); }
.set-check {
  width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid var(--border);
  background: var(--surface-2); display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: 16px; cursor: pointer;
}
.set-check.checked { background: var(--lime); border-color: var(--lime); color: #14170a; }

/* ---- sensation row ---- */
.sensation-row { margin-top: 14px; }
.sensation-row label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
.sensation-row textarea {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 13.5px; padding: 10px 12px;
  font-family: inherit; resize: vertical; min-height: 44px;
}
.sensation-row textarea:focus { outline: none; border-color: var(--lime); }

/* ---- cardio card ---- */
.cardio-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px;
}
.cardio-card .icon { font-size: 22px; color: var(--amber); flex: 0 0 auto; }
.cardio-card .txt { flex: 1; font-size: 13px; color: var(--text-dim); }
.cardio-card .txt b { color: var(--text); font-weight: 500; }
.cardio-toggle {
  flex: 0 0 auto; width: 44px; height: 26px; border-radius: 999px; background: var(--surface-2);
  border: 0.5px solid var(--border); position: relative; cursor: pointer;
}
.cardio-toggle .knob {
  position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-faint); transition: all 0.2s ease;
}
.cardio-toggle.on { background: rgba(200,232,90,0.18); border-color: var(--lime-dim); }
.cardio-toggle.on .knob { left: 20px; background: var(--lime); }

.finish-btn {
  width: 100%; padding: 15px; border-radius: var(--radius); border: none;
  background: var(--lime); color: #14170a; font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px; font-weight: 600; letter-spacing: 0.02em; margin-top: 6px; cursor: pointer;
}
.finish-btn:active { transform: scale(0.98); }
.finish-btn.done { background: var(--surface-2); color: var(--text-dim); border: 0.5px solid var(--border); }

/* ---- section title ---- */
.section-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint);
  margin: 22px 0 10px; font-weight: 600;
}
.section-title:first-child { margin-top: 4px; }

/* ---- generic info card ---- */
.info-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 15px 17px; margin-bottom: 10px;
}
.info-card h3 { font-size: 16px; margin-bottom: 6px; }
.info-card p { font-size: 13.5px; color: var(--text-dim); margin: 0; }
.info-card ul { margin: 6px 0 0; padding-left: 18px; }
.info-card li { font-size: 13.5px; color: var(--text-dim); margin-bottom: 4px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 340px) { .two-col { grid-template-columns: 1fr; } }

/* ---- creatina card ---- */
.creatina-card { display: flex; flex-direction: column; gap: 12px; }
.creatina-row { display: flex; align-items: center; justify-content: space-between; }
.creatina-label { font-size: 14.5px; font-weight: 500; color: var(--text); }
.creatina-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.creatina-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.creatina-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px; border-radius: 10px; border: 0.5px solid var(--border);
  background: var(--surface-2); color: var(--text-dim); font-size: 13.5px; font-weight: 500;
  cursor: pointer; font-family: 'Inter', sans-serif;
}
.creatina-btn i { font-size: 16px; }
.creatina-btn.active { background: rgba(109,184,232,0.16); border-color: var(--sky); color: var(--text); }
.creatina-btn.active-off { background: rgba(226,100,90,0.1); border-color: rgba(226,100,90,0.4); color: var(--text-dim); }

/* ---- meal card (dieta) ---- */
.meal-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.meal-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.meal-head h3 { font-size: 16px; }
.meal-note { font-size: 12px; color: var(--text-faint); font-style: italic; padding: 0 16px 10px; margin-top: -8px; }
.meal-body { display: none; padding: 0 16px 16px; }
.meal-card.open .meal-body { display: block; }
.meal-option {
  border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s ease;
}
.meal-option.selected { border-color: var(--lime); background: rgba(200,232,90,0.06); }
.meal-option-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0; }
.meal-option-row .k { color: var(--text-faint); flex: 0 0 34px; font-weight: 600; }
.meal-option-row .v { color: var(--text); flex: 1; text-align: right; }
.meal-check { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--lime); margin-top: 4px; }

.meal-hint { font-size: 12px; color: var(--text-faint); margin-bottom: 12px; line-height: 1.5; }
.meal-column { margin-bottom: 14px; }
.meal-column:last-child { margin-bottom: 0; }
.meal-column-label {
  font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 600; margin-bottom: 7px;
}
.meal-chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.meal-chip {
  border: 0.5px solid var(--border); border-radius: 999px; padding: 8px 13px; font-size: 12.5px;
  color: var(--text-dim); cursor: pointer; background: var(--surface-2); transition: all 0.15s ease;
}
.meal-chip.selected { border-color: var(--lime); background: rgba(200,232,90,0.14); color: var(--text); font-weight: 500; }

/* ---- supplement table ---- */
.supp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.supp-table td { padding: 7px 0; border-bottom: 0.5px solid var(--border); vertical-align: top; }
.supp-table td:first-child { color: var(--text); font-weight: 500; padding-right: 10px; width: 42%; }
.supp-table td:last-child { color: var(--text-dim); text-align: right; }
.supp-table tr:last-child td { border-bottom: none; }

/* ---- bottom nav (floating island, liquid glass) ---- */
.bottom-nav-wrap {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: center;
  padding: 0 16px calc(14px + var(--safe-bottom));
  pointer-events: none;
}
.bottom-nav {
  pointer-events: auto;
  display: flex; align-items: center; gap: 4px;
  background: rgba(38, 36, 28, 0.55);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 0.5px solid rgba(237, 233, 220, 0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 32px rgba(0,0,0,0.35);
  border-radius: 999px;
  padding: 7px;
}
.nav-btn {
  position: relative; flex: 0 0 auto;
  width: 52px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); background: none; border: none; cursor: pointer;
  border-radius: 999px;
}
.nav-pill {
  position: absolute; inset: 0; border-radius: 999px;
  background: rgba(255,255,255,0.1);
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.nav-btn.active .nav-pill { opacity: 1; transform: scale(1); }
.nav-btn.active { color: var(--text); }
.nav-btn .nav-icon { width: 22px; height: 22px; position: relative; z-index: 1; }

/* ---- history / stats ---- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.stat-card .label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-card .value { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; margin-top: 2px; }
.stat-card .value.lime { color: var(--lime); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-faint); font-size: 13px; }
.empty-state .big { font-size: 32px; display: block; margin-bottom: 10px; }

/* ---- year calendar (github style) ---- */
.year-cal-card {
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.18);
  border-radius: var(--radius);
  padding: 15px 16px; margin-bottom: 12px;
}
.year-cal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.year-cal-head h3 { font-size: 15px; }
.year-cal-head .count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.year-cal-scroll { overflow-x: auto; padding-bottom: 4px; }
.year-cal-grid {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px);
  gap: 3px; width: max-content;
}
.year-cal-cell {
  width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2);
  border: 0.5px solid var(--border);
}
.year-cal-cell.future { opacity: 0.35; }
.year-cal-cell.done-entreno { background: var(--lime); border-color: var(--lime); }
.year-cal-cell.done-dieta { background: var(--amber); border-color: var(--amber); }
.year-cal-cell.done-creatina { background: var(--sky); border-color: var(--sky); }
.year-cal-cell.today { box-shadow: 0 0 0 1.5px var(--text); }
.year-cal-months {
  display: grid; grid-auto-flow: column; gap: 3px; width: max-content; margin-bottom: 4px;
}
.year-cal-month-label {
  font-size: 9.5px; color: var(--text-faint); grid-row: span 1;
}
.year-cal-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
.year-cal-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--lime); color: #14170a; padding: 10px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s ease;
  z-index: 50; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- inicio (home) ---- */
.hero-card {
  background: var(--glass-bg); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%);
  border: 0.5px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 32px rgba(0,0,0,0.22);
  border-radius: 18px; padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute; top: -60%; right: -30%; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(200,232,90,0.16), transparent 70%);
  pointer-events: none;
}
.hero-eyebrow { font-size: 11px; color: var(--lime); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.hero-title { font-size: 24px; margin-top: 6px; }
.hero-sub { font-size: 13.5px; color: var(--text-dim); margin-top: 5px; }
.hero-cta {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 11px 18px;
  background: var(--lime); color: #14170a; border-radius: 999px; font-size: 14px; font-weight: 500;
  text-decoration: none; cursor: pointer; border: none; font-family: 'Inter', sans-serif;
}
.hero-cta.secondary {
  background: rgba(255,255,255,0.06); color: var(--text); border: 0.5px solid var(--glass-border);
}
.hero-rest-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: rgba(224,169,74,0.12); border: 0.5px solid rgba(224,169,74,0.3); color: var(--amber);
  font-size: 13px; font-weight: 500; margin-top: 6px;
}

.quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.quick-card {
  background: var(--glass-bg); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);

  border-radius: 14px; padding: 14px; cursor: pointer;
}
.quick-card .qi { font-size: 20px; color: var(--lime); margin-bottom: 8px; display: block; }
.quick-card .qt { font-size: 13.5px; font-weight: 500; }
.quick-card .qs { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

.mini-meal-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 0.5px solid var(--glass-border);
}
.mini-meal-row:last-child { border-bottom: none; }
.mini-meal-row .mi { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--text-faint); font-size: 13px; }
.mini-meal-row.chosen .mi { background: var(--lime); color: #14170a; }
.mini-meal-row .mt { flex: 1; font-size: 13.5px; }
.mini-meal-row .mv { font-size: 12px; color: var(--text-faint); }
.mini-meal-row.chosen .mv { color: var(--lime); }

<script>
// EXERCISE_WGER_TERMS — término de búsqueda en inglés para la API pública de wger.de
// Se usa para intentar cargar una imagen/foto real del ejercicio.
// Si la carga falla (sin conexión, término sin resultado, etc.) la tarjeta cae
// automáticamente a la ilustración SVG local (EXERCISE_SVGS) — nunca se queda sin visual.
const EXERCISE_WGER_TERMS = {
  squat: "hack squat",
  leg_press: "leg press",
  leg_extension: "leg extension",
  leg_curl: "leg curl",
  abductor: "hip abductor",
  calf_raise: "standing calf raise",
  cable_crunch: "cable crunch",
  incline_press: "incline bench press",
  flat_press: "dumbbell bench press",
  fly: "chest fly",
  shoulder_press: "shoulder press machine",
  triceps_pushdown: "triceps pushdown",
  triceps_overhead: "overhead triceps extension",
  seated_calf: "seated calf raise",
  lat_pulldown: "lat pulldown",
  cable_row: "seated cable row",
  chest_supported_row: "chest supported row",
  pullover: "cable pullover",
  bicep_curl: "barbell curl",
  hammer_curl: "hammer curl",
  hanging_leg_raise: "hanging leg raise",
  lateral_raise: "lateral raise",
  rear_delt_fly: "reverse fly",
  cable_crossover: "cable crossover",
  face_pull: "face pull",
  leg_press_calf: "calf press leg press",
  rdl: "romanian deadlift",
  hip_thrust: "hip thrust",
  pallof_press: "pallof press"
};

// ===================== CARGA DE IMÁGENES CON FALLBACK =====================
// Cache en memoria para no repetir peticiones a la misma búsqueda durante la sesión.
const _wgerImageCache = {};

async function fetchWgerExerciseImage(patron) {
  if (_wgerImageCache[patron] !== undefined) return _wgerImageCache[patron];
  const term = EXERCISE_WGER_TERMS[patron];
  if (!term) { _wgerImageCache[patron] = null; return null; }

  try {
    const searchUrl = `https://wger.de/api/v2/exercise/search/?term=${encodeURIComponent(term)}&language=en&format=json`;
    const searchRes = await fetch(searchUrl, { signal: AbortSignal.timeout(5000) });
    if (!searchRes.ok) throw new Error('search failed');
    const searchData = await searchRes.json();
    const match = searchData?.suggestions?.[0]?.data;
    const baseId = match?.base_id;
    if (!baseId) { _wgerImageCache[patron] = null; return null; }

    const infoUrl = `https://wger.de/api/v2/exerciseinfo/${baseId}/?format=json`;
    const infoRes = await fetch(infoUrl, { signal: AbortSignal.timeout(5000) });
    if (!infoRes.ok) throw new Error('info failed');
    const infoData = await infoRes.json();
    const img = infoData?.images?.[0]?.image || null;
    _wgerImageCache[patron] = img;
    return img;
  } catch (e) {
    _wgerImageCache[patron] = null;
    return null;
  }
}

// Inyecta la imagen real en el contenedor si está disponible; si falla, deja el SVG que ya está pintado.
function loadExerciseImageInto(containerEl, patron) {
  fetchWgerExerciseImage(patron).then(url => {
    if (!url || !containerEl || !containerEl.isConnected) return;
    const img = new Image();
    img.onload = () => {
      containerEl.innerHTML = '';
      img.style.cssText = 'width:100%; height:auto; display:block; border-radius:8px;';
      img.alt = 'Demostración del ejercicio';
      containerEl.appendChild(img);
      const label = document.createElement('div');
      label.className = 'frames-label';
      label.innerHTML = '<span>Ejecución del ejercicio</span>';
      containerEl.appendChild(label);
    };
    img.onerror = () => { /* deja el SVG de respaldo, ya está en el DOM */ };
    img.src = url;
  }).catch(() => { /* deja el SVG de respaldo */ });
}

</script>
<script>
// ===================== ESTADO Y STORAGE =====================
// Storage local en el propio dispositivo (localStorage de Safari/Chrome).
// Los datos quedan guardados en ESTE navegador — no dependen de Claude.ai ni de conexión.
const LOCAL_PREFIX = 'cambio_fisico_pablo:';
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      return raw !== null ? { key, value: raw } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
      return { key, value };
    } catch (e) { console.error('No se pudo guardar en este dispositivo', e); return null; }
  },
  async delete(key) {
    try { localStorage.removeItem(LOCAL_PREFIX + key); return { key, deleted: true }; }
    catch (e) { return null; }
  }
};

let STATE = {
  currentDayId: PLAN_DATA.dias[0].id,
  logs: {},        // logs[dayId][fechaISO] = { sets: {exId: [{peso,reps,done}]}, sensacion, cardio, finished }
  mealLogs: {},     // mealLogs[fechaISO] = { c1: optionIndex, c2: ... }
  creatinaLogs: {}, // creatinaLogs[fechaISO] = true/false
};

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDateEs(iso) {
  const d = new Date(iso + 'T00:00:00');
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`;
}

async function loadState() {
  try {
    const res = await window.storage.get('logs');
    if (res && res.value) STATE.logs = JSON.parse(res.value);
  } catch (e) { STATE.logs = {}; }
  try {
    const res = await window.storage.get('mealLogs');
    if (res && res.value) STATE.mealLogs = JSON.parse(res.value);
  } catch (e) { STATE.mealLogs = {}; }
  try {
    const res = await window.storage.get('creatinaLogs');
    if (res && res.value) STATE.creatinaLogs = JSON.parse(res.value);
  } catch (e) { STATE.creatinaLogs = {}; }
  try {
    const res = await window.storage.get('currentDayId');
    if (res && res.value) STATE.currentDayId = res.value;
  } catch (e) { /* keep default */ }
}

async function saveLogs() {
  try { await window.storage.set('logs', JSON.stringify(STATE.logs)); }
  catch (e) { console.error('storage error', e); }
}
async function saveMealLogs() {
  try { await window.storage.set('mealLogs', JSON.stringify(STATE.mealLogs)); }
  catch (e) { console.error('storage error', e); }
}
async function saveCreatinaLogs() {
  try { await window.storage.set('creatinaLogs', JSON.stringify(STATE.creatinaLogs)); }
  catch (e) { console.error('storage error', e); }
}
async function saveCurrentDay() {
  try { await window.storage.set('currentDayId', STATE.currentDayId); }
  catch (e) { console.error('storage error', e); }
}

function getDayLog(dayId, fecha) {
  if (!STATE.logs[dayId]) STATE.logs[dayId] = {};
  if (!STATE.logs[dayId][fecha]) STATE.logs[dayId][fecha] = { sets: {}, sensacion: '', cardio: false, finished: false };
  return STATE.logs[dayId][fecha];
}

function parseSeriesCount(seriesStr) {
  // "3 x 8-10" -> 3 ; "3 x 12/12" -> 3
  const m = seriesStr.match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 3;
}

// ===================== NAVEGACIÓN =====================
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));

  if (view === 'inicio') renderInicio();
}

function showToast(msg) {

  t.textContent = msg;
  t.classList.add('show');

}

// ===================== RENDER: ENTRENO =====================
function renderEntreno() {

    </div>

    <div class="cardio-card">
      <div class="icon"><i class="ti ti-run" aria-hidden="true"></i></div>
      <div class="txt"><b>Cardio · ${PLAN_DATA.cardio.tiempo}</b><br>${PLAN_DATA.cardio.frecuencia}</div>

          <div class="exercise-sub">${ex.series} · ${ex.grupo}</div>

      <div class="exercise-body">
        <div class="exercise-illustration" id="illus-${ex.id}" data-patron="${ex.patron}" data-loaded="0">
          ${svg}
          <div class="frames-label"><span>Inicio</span><span>Final</span></div>
        </div>
        <div class="exercise-notes"><b>Técnica:</b> ${ex.notas}</div>

function toggleExercise(exId) {
  const card = document.getElementById('ex-' + exId);

function updateSet(dayId, fecha, exId, idx, field, value) {
  const log = getDayLog(dayId, fecha);
  if (!log.sets[exId]) log.sets[exId] = [];
  if (!log.sets[exId][idx]) log.sets[exId][idx] = { peso: '', reps: '', done: false };
  log.sets[exId][idx][field] = value;
  saveLogs();
}

function toggleSetDone(dayId, fecha, exId, idx) {
  const log = getDayLog(dayId, fecha);
  if (!log.sets[exId]) log.sets[exId] = [];
  if (!log.sets[exId][idx]) log.sets[exId][idx] = { peso: '', reps: '', done: false };
  log.sets[exId][idx].done = !log.sets[exId][idx].done;
  saveLogs();
  renderEntreno();
  renderDayPills();
}

function toggleCardio(dayId, fecha) {
  const log = getDayLog(dayId, fecha);
  log.cardio = !log.cardio;
  saveLogs();
  renderEntreno();
}

function onSensacionInput(dayId, fecha, value) {
  const log = getDayLog(dayId, fecha);
  log.sensacion = value;
  saveLogs();
}

function toggleFinish(dayId, fecha) {
  const log = getDayLog(dayId, fecha);
  log.finished = !log.finished;
  saveLogs();
  renderEntreno();
  renderDayPills();
  if (log.finished) showToast('Día registrado ✓');
}

// ===================== LÓGICA: SIGUIENTE DÍA PENDIENTE =====================
// Recorre los 5 días de forma secuencial y cíclica. Devuelve el primer día
// que NO tenga ningún registro con finished=true, empezando justo después
// del último día que sí se completó (el más reciente por fecha).
function getNextPendingDia() {
  const dias = PLAN_DATA.dias;
  // Buscar el último día completado (por fecha de finalización más reciente)
  let lastCompletedIdx = -1;
  let lastCompletedFecha = null;
  dias.forEach((dia, idx) => {
    const dayLogs = STATE.logs[dia.id] || {};
    Object.keys(dayLogs).forEach(fecha => {
      if (dayLogs[fecha].finished) {
        if (!lastCompletedFecha || fecha > lastCompletedFecha) {
          lastCompletedFecha = fecha;
          lastCompletedIdx = idx;
        }
      }
    });
  });
  if (lastCompletedIdx === -1) return dias[0]; // nada registrado aún: empezar por el día 1
  const nextIdx = (lastCompletedIdx + 1) % dias.length;
  return dias[nextIdx];
}

function isDiaCompletadoHoy(diaId) {
  const fecha = todayISO();
  const log = STATE.logs[diaId] && STATE.logs[diaId][fecha];
  return !!(log && log.finished);
}

function renderMealCard(comida, mealLog) {
  // mealLog[comida.id] es un array paralelo a comida.columnas: uno por columna,
  // cada valor es el índice de fila (dentro de comida.opciones) elegido para esa columna,
  // o undefined/null si esa columna no se ha elegido todavía.
  const selArr = mealLog[comida.id] || [];
  const numColumnas = comida.columnas.length;

  // Solo cuentan como "elegibles" las columnas que tienen al menos una opción real (no todo "-")
  const columnasConOpciones = comida.columnas.map((_, colIdx) =>
    comida.opciones.some(fila => fila[colIdx] && fila[colIdx] !== '-')
  );
  const totalElegibles = columnasConOpciones.filter(Boolean).length;
  const elegidas = selArr.filter((v, i) => columnasConOpciones[i] && v !== undefined && v !== null).length;

  // Construir, por columna, la lista de valores únicos disponibles (con su índice de fila de origen)
  const columnasHtml = comida.columnas.map((colName, colIdx) => {
    const chipsHtml = comida.opciones.map((fila, rowIdx) => {
      const val = fila[colIdx];
      if (val === '-' || val === undefined) return ''; // esa fila no ofrece opción real en esta columna
      const isSelected = selArr[colIdx] === rowIdx;
      return `<div class="meal-chip ${isSelected ? 'selected' : ''}" onclick="selectMealColumnOption('${comida.id}', ${colIdx}, ${rowIdx}, ${numColumnas})">${val}</div>`;
    }).join('');
    if (!chipsHtml.trim()) return ''; // columna vacía en todas las filas (ej. "G" con solo "-")
    return `
      <div class="meal-column">
        <div class="meal-column-label">${colName}</div>
        <div class="meal-chip-row">${chipsHtml}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="meal-card" id="meal-${comida.id}">
      <div class="meal-head" onclick="toggleMeal('${comida.id}')">
        <h3>${comida.nombre}</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11.5px; color:${elegidas > 0 ? 'var(--lime)' : 'var(--text-faint)'};">${elegidas}/${totalElegibles}</span>
          <div class="exercise-chevron">⌄</div>
        </div>
      </div>
      ${comida.nota ? `<div class="meal-note">${comida.nota}</div>` : ''}
      <div class="meal-body">
        <div class="meal-hint">Elige una opción de cada categoría. Puedes combinar libremente.</div>
        ${columnasHtml}
      </div>
    </div>
  `;
}

function toggleMeal(mealId) {
  document.getElementById('meal-' + mealId).classList.toggle('open');
}

function selectMealColumnOption(mealId, colIdx, rowIdx, numColumnas) {
  const fecha = todayISO();
  if (!STATE.mealLogs[fecha]) STATE.mealLogs[fecha] = {};
  if (!Array.isArray(STATE.mealLogs[fecha][mealId])) STATE.mealLogs[fecha][mealId] = new Array(numColumnas).fill(null);
  const arr = STATE.mealLogs[fecha][mealId];
  arr[colIdx] = arr[colIdx] === rowIdx ? null : rowIdx;
  saveMealLogs();
  renderDieta();
  document.getElementById('meal-' + mealId).classList.add('open');
}


// ===================== CALENDARIO ANUAL (estilo github) =====================
function getEntrenoCompletedDates() {
  // set de fechas ISO donde CUALQUIER día de entreno fue marcado como finalizado
  const set = new Set();
  Object.keys(STATE.logs).forEach(dayId => {
    Object.keys(STATE.logs[dayId]).forEach(fecha => {
      if (STATE.logs[dayId][fecha].finished) set.add(fecha);
    });
  });
  return set;
}

function getDietaCompletedDates() {
  // set de fechas ISO donde se eligió al menos una opción en alguna columna de alguna comida
  const set = new Set();
  Object.keys(STATE.mealLogs).forEach(fecha => {
    const meals = STATE.mealLogs[fecha];
    const anySelected = Object.values(meals).some(arr => Array.isArray(arr) && arr.some(v => v !== undefined && v !== null));
    if (anySelected) set.add(fecha);
  });
  return set;
}

function getCreatinaCompletedDates() {
  // set de fechas ISO donde se marcó la creatina como tomada
  const set = new Set();
  Object.keys(STATE.creatinaLogs).forEach(fecha => {
    if (STATE.creatinaLogs[fecha]) set.add(fecha);
  });
  return set;
}

function renderYearCalendar(title, doneDates, colorClass, legendLabel, legendColorVar) {
  const year = new Date().getFullYear();
  const todayStr = todayISO();
  const start = new Date(year, 0, 1);
  // retroceder hasta el lunes anterior (o el mismo día) para alinear columnas de semana
  const startDow = (start.getDay() + 6) % 7; // 0 = lunes
  const gridStart = new Date(start);
  gridStart.setDate(gridStart.getDate() - startDow);

  const end = new Date(year, 11, 31);
  const endDow = (end.getDay() + 6) % 7;
  const gridEnd = new Date(end);
  gridEnd.setDate(gridEnd.getDate() + (6 - endDow));

  const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
  const totalWeeks = Math.ceil(totalDays / 7);

  const monthLabels = [];
  let cells = '';
  let lastMonth = -1;
  let count = 0;

  for (let w = 0; w < totalWeeks; w++) {
    const weekStartDate = new Date(gridStart);
    weekStartDate.setDate(weekStartDate.getDate() + w * 7);
    const m = weekStartDate.getMonth();
    if (m !== lastMonth && weekStartDate.getFullYear() === year) {
      monthLabels.push({ week: w, label: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m] });
      lastMonth = m;
    }
    for (let d = 0; d < 7; d++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(cellDate.getDate() + w * 7 + d);
      const iso = isoDate(cellDate);
      const inYear = cellDate.getFullYear() === year;
      const isFuture = iso > todayStr;
      const isDone = doneDates.has(iso);
      if (isDone && inYear) count++;
      let cls = 'year-cal-cell';
      if (!inYear) cls += ' future';
      else if (isFuture) cls += ' future';
      if (isDone) cls += ' ' + colorClass;
      if (iso === todayStr) cls += ' today';
      cells += `<div class="${cls}" title="${iso}"></div>`;
    }
  }

  // fila de labels de mes posicionada por columna (aprox, usando grid-column)
  let monthRow = '<div class="year-cal-months">';
  let colCursor = 0;
  monthLabels.forEach(m => {
    const gap = m.week - colCursor;
    for (let i = 0; i < gap; i++) monthRow += '<div style="width:11px;grid-row:span 7;"></div>';
    monthRow += `<div class="year-cal-month-label" style="grid-row:span 7;">${m.label}</div>`;
    colCursor = m.week + 1;
  });
  monthRow += '</div>';

  return `
    <div class="year-cal-card">
      <div class="year-cal-head"><h3>${title}</h3><div class="count">${count} días en ${year}</div></div>
      <div class="year-cal-scroll">
        ${monthRow}
        <div class="year-cal-grid">${cells}</div>
      </div>
      <div class="year-cal-legend">
        <span><span class="sw" style="background:var(--surface-2); border:0.5px solid var(--border);"></span>Sin registro</span>
        <span><span class="sw" style="background:var(--${legendColorVar});"></span>${legendLabel}</span>
      </div>
    </div>
  `;
}

// ===================== RENDER: PROGRESO =====================
function renderProgreso() {
  const fechas = Object.keys(STATE.logs).reduce((acc, dayId) => {
    Object.keys(STATE.logs[dayId]).forEach(f => acc.add(f));
    return acc;
  }, new Set());

  let totalDiasCompletados = 0;
  let totalSeriesHechas = 0;
  Object.keys(STATE.logs).forEach(dayId => {
    Object.values(STATE.logs[dayId]).forEach(log => {
      if (log.finished) totalDiasCompletados++;
      Object.values(log.sets || {}).forEach(setArr => {
        totalSeriesHechas += setArr.filter(s => s && s.done).length;
      });
    });
  });

  const entrenoDates = getEntrenoCompletedDates();
  const dietaDates = getDietaCompletedDates();
  const creatinaDates = getCreatinaCompletedDates();

  const sortedFechas = Array.from(fechas).sort().reverse();

  let historyHtml = '';
  if (sortedFechas.length === 0) {
    historyHtml = `<div class="empty-state"><i class="ti ti-clipboard-list big" aria-hidden="true" style="font-size:32px; display:block; margin-bottom:10px;"></i>Todavía no has registrado ningún día.<br>Empieza marcando series en Entreno.</div>`;
  } else {
    historyHtml = sortedFechas.slice(0, 30).map(fecha => {
      const dayEntries = Object.keys(STATE.logs).filter(dayId => STATE.logs[dayId][fecha]);
      return dayEntries.map(dayId => {
        const dia = PLAN_DATA.dias.find(d => d.id === dayId);
        const log = STATE.logs[dayId][fecha];
        const setsCount = Object.values(log.sets || {}).reduce((sum, arr) => sum + arr.filter(s => s && s.done).length, 0);
        return `
          <div class="info-card">
            <h3 style="font-size:14px; display:flex; justify-content:space-between; align-items:center;">
              <span>${dia.nombre}</span>
              ${log.finished ? '<span style="color:var(--lime); font-size:11px;">COMPLETADO</span>' : ''}
            </h3>
            <p>${fmtDateEs(fecha)} · ${setsCount} series registradas${log.cardio ? ' · Cardio ✓' : ''}</p>
            ${log.sensacion ? `<p style="margin-top:6px; font-style:italic;">"${log.sensacion}"</p>` : ''}
          </div>
        `;
      }).join('');
    }).join('');
  }

  document.getElementById('progreso-content').innerHTML = `
    <div class="section-title">Resumen</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Días completados</div><div class="value lime">${totalDiasCompletados}</div></div>
      <div class="stat-card"><div class="label">Series totales</div><div class="value">${totalSeriesHechas}</div></div>
    </div>

    <div class="section-title">Calendario del año</div>
    ${renderYearCalendar('Entrenamiento', entrenoDates, 'done-entreno', 'Día completado', 'lime')}
    ${renderYearCalendar('Dieta', dietaDates, 'done-dieta', 'Comida registrada', 'amber')}
    ${renderYearCalendar('Creatina', creatinaDates, 'done-creatina', 'Creatina tomada', 'sky')}

    <div class="section-title">Historial</div>
    ${historyHtml}
  `;

  // auto-scroll de cada calendario hasta el mes actual
  requestAnimationFrame(() => {
    document.querySelectorAll('.year-cal-scroll').forEach(el => {
      el.scrollLeft = el.scrollWidth;
    });
  });
}

// ===================== INIT =====================
async function init() {
  await loadState();
  document.getElementById('greeting-date').textContent = fmtDateEs(todayISO());
  renderInicio();
  renderDayPills();
  renderEntreno();
  renderDieta();
}

init();

</script>
